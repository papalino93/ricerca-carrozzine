<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #16302E 0%, #0e211f 100%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .decor {
    position: absolute;
    border-radius: 999px;
    background: #C98A3A;
    opacity: 0.10;
  }
  .decor.d1 { width: 520px; height: 520px; top: -180px; left: -160px; }
  .decor.d2 { width: 380px; height: 380px; bottom: -160px; right: -120px; }
  .card {
    display: flex;
    align-items: center;
    gap: 56px;
    z-index: 1;
  }
  .logo {
    width: 220px;
    height: 220px;
    border-radius: 52px;
    background: #ffffff;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img { width: 76%; height: 76%; object-fit: contain; }
  .text h1 {
    font-size: 62px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .text p {
    font-size: 27px;
    font-weight: 600;
    color: #b9c9c6;
    max-width: 580px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="decor d1"></div>
  <div class="decor d2"></div>
  <div class="card">
    <div class="logo"><img src="__LOGO_DATA_URI__" /></div>
    <div class="text">
      <h1>Ricerca Ausili</h1>
      <p>Disponibilità e noleggio di carrozzine e altri ausili, con documenti di consegna e restituzione pronti in PDF.</p>
    </div>
  </div>
</body>
</html>
